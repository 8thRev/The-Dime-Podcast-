name: TEMP verify setup-node

# Throwaway. Exists only to prove actions/setup-node@v7 resolves and emits no
# Node 20 deprecation annotation. video-catalog.yml is the only real consumer
# of setup-node, and dispatching it costs YouTube quota and pushes a commit.
# Delete this file once the run is green.
on:
  push:
    branches:
      - claude/vigorous-dewdney-5c059f

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Report versions
        run: |
          node --version
          npm --version
