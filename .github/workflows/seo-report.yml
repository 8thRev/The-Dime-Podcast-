name: SEO Report

on:
  # Weekly, Monday mornings.
  schedule:
    - cron: '0 13 * * 1'

  # Manual triggering for one-off runs.
  workflow_dispatch:

jobs:
  seo-report:
    runs-on: ubuntu-latest
    # Needed to commit the weekly snapshot back to the repo.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      # Weekly Report v2 data layer (docs/report-v2-spec.md, Phase 1). Writes
      # data/weekly/YYYY-MM-DD.json and data/reach.csv. continue-on-error so
      # a failure here can never block the existing email below; each
      # source inside it already degrades to "unavailable" on its own.
      - name: Build weekly snapshot
        continue-on-error: true
        timeout-minutes: 20
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          SIMPLECAST_API_TOKEN: ${{ secrets.SIMPLECAST_API_TOKEN }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          # Weekly AI answer check (bot/ai_visibility.py), about $1 to $2 a run.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd bot
          python weekly_report.py

      - name: Run SEO report
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
          SIMPLECAST_API_TOKEN: ${{ secrets.SIMPLECAST_API_TOKEN }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          cd bot
          python seo_report.py

      - name: Commit weekly snapshot
        if: ${{ !cancelled() }}
        run: |
          git config user.name "dime-transcript-bot"
          git config user.email "actions@github.com"
          git add data/weekly data/reach.csv
          if git diff --cached --quiet; then
            echo "No snapshot to commit."
            exit 0
          fi
          # [skip ci]: data files are not part of the site build, so this
          # push should not trigger a deploy.
          git commit -m "Weekly report snapshot [skip ci]"
          # Same retry as the map and catalog workflows: this can race other
          # scheduled jobs pushing to main.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5), rebasing onto latest main..."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push weekly snapshot after 5 attempts"
          exit 1
