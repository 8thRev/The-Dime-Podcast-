name: IndexNow

# Pings IndexNow (Bing, Yandex, Seznam, Naver — not Google) when published
# content changes, so new episode pages get crawled in hours instead of
# waiting on the engines' own schedule. See SEO_ROADMAP.md.
#
# Note: the transcript pipeline does NOT trigger this workflow, because its
# auto-commits carry "[skip ci]" and GitHub skips push-event workflows for
# that string. That pipeline submits its own URLs directly as a final step in
# transcript-pipeline.yml. (Vercel does not honour [skip ci], so those commits
# still deploy normally — only Actions skips them.)

on:
  push:
    branches: [main]
    paths:
      - 'app/content/**'
      - 'app/src/pages/**'

  workflow_dispatch:
    inputs:
      mode:
        description: 'changed = URLs touched by the last commit; all = every sitemap URL (one-time seed only)'
        required: false
        default: 'changed'
        type: choice
        options:
          - changed
          - all
      dry_run:
        description: 'Print the URL list without submitting'
        required: false
        default: false
        type: boolean

# Two pushes in quick succession would otherwise overlap, each sleeping out
# its own deploy wait and racing the other's submission.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: changed-URL mode diffs against the push event's
          # "before" SHA, which a shallow clone would not contain, and a push
          # carrying several commits would otherwise have all but its last
          # commit silently dropped.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A full re-seed reads the generated sitemap, which only exists after a
      # build. The changed-URL path derives everything from the git diff, so it
      # needs no build at all.
      - name: Install dependencies and build (full seed only)
        if: ${{ github.event.inputs.mode == 'all' }}
        working-directory: app
        run: |
          npm ci
          npm run build

      # Note: github.event.inputs.* are strings, so these compare against
      # 'true'/'all' rather than booleans. Switching to the typed `inputs.*`
      # context without dropping the quotes would silently evaluate false.
      # On a push event both are null, which yields the --changed branch.
      - name: Submit to IndexNow
        working-directory: app
        run: |
          node scripts/submit-indexnow.mjs \
            ${{ github.event.inputs.mode == 'all' && '--all' || format('--changed {0}', github.event.before || 'HEAD~1') }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --wait-seconds 300
